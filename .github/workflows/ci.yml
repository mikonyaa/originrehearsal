name: Verify and deliver
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Install pinned Chromium and Linux dependencies
        run: node ./dist/cli/main.js install-browser --with-deps
      - run: npm run test:e2e
      - run: npm run verify:ui
      - run: npm run verify:site
      - run: node ./dist/cli/main.js demo --out ./artifacts/ci-demo --no-open --json
      - name: Pack and install this exact archive in an independent consumer
        run: npm run test:consumer
      - run: npm run audit:publication
      - run: node scripts/provenance.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            artifacts/package/originrehearsal-0.1.0.tgz
            artifacts/package/consumer-result.json
            artifacts/package/build-provenance.json
          if-no-files-found: error
          retention-days: 7
  site:
    name: Package verified static site
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site
          retention-days: 1
  deploy:
    name: Deploy verified Pages
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy exact verified site artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
